<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI College Chatbot</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    margin: 0;
    background: #eef2ff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.chat-container {
    width: 420px;
    height: 650px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.2);
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

.header {
    background: #4a67d6;
    color: white;
    padding: 20px;
    text-align: center;
}

.header h2 {
    margin: 0;
}

.header p {
    margin: 8px 0 0;
    font-size: 14px;
}

.chat-box {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    background: #f8f9fa;
}

.message {
    margin: 10px 0;
    padding: 10px 14px;
    border-radius: 12px;
    max-width: 80%;
    line-height: 1.4;
}

.bot {
    background: #e4e7eb;
    color: #222;
}

.user {
    background: #4a67d6;
    color: white;
    margin-left: auto;
}

.quick-buttons {
    padding: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    background: white;
}

.quick-buttons button {
    border: none;
    background: #e8ecff;
    color: #3448a5;
    padding: 8px 10px;
    border-radius: 15px;
    cursor: pointer;
    font-size: 12px;
}

.quick-buttons button:hover {
    background: #d5dcff;
}

.input-area {
    display: flex;
    padding: 10px;
    border-top: 1px solid #ddd;
    background: white;
}

.input-area input {
    flex: 1;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 20px;
    outline: none;
}

.input-area button {
    margin-left: 8px;
    width: 45px;
    border: none;
    border-radius: 50%;
    background: #4a67d6;
    color: white;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

<body>

<div class="chat-container">

<div class="header">
<h2>🎓 AI College Chatbot</h2>
<p>Your Virtual College Assistant</p>
</div>

<div class="chat-box" id="chatBox">

<div class="message bot">
👋 Hello! I am your AI College Assistant.<br><br>
You can ask me about college timings, departments, library, exams, attendance, placements and more.
</div>

</div>

<div class="quick-buttons">

<button onclick="quickQuestion('What are the college timings?')">
College Timings
</button>

<button onclick="quickQuestion('Tell me about departments')">
Departments
</button>

<button onclick="quickQuestion('Tell me about library')">
Library
</button>

<button onclick="quickQuestion('What is the attendance requirement?')">
Attendance
</button>

<button onclick="quickQuestion('Tell me about placements')">
Placements
</button>

</div>

<div class="input-area">

<input
type="text"
id="userInput"
placeholder="Ask your question..."
onkeypress="handleEnter(event)"
>

<button onclick="sendMessage()">➤</button>

</div>

</div>

<script>

const knowledgeBase = [

{
keywords: ["hello", "hi", "hey"],
answer: "👋 Hello! How can I help you with college information?"
},

{
keywords: ["timing", "timings", "college time", "working hours"],
answer: "🕘 College timings are from 9:00 AM to 4:00 PM, Monday to Saturday."
},

{
keywords: ["department", "departments", "cse", "ece", "eee", "civil", "mech"],
answer: "🏫 Our college has departments such as CSE, ECE, EEE, Mechanical and Civil Engineering."
},

{
keywords: ["library", "book", "books"],
answer: "📚 The college library provides textbooks, reference books, journals and digital learning resources."
},

{
keywords: ["attendance", "percentage"],
answer: "📊 Students are expected to maintain the minimum attendance percentage required by the college."
},

{
keywords: ["exam", "exams", "semester", "test"],
answer: "📝 Semester examinations are conducted according to the academic calendar. Students should check the official exam timetable."
},

{
keywords: ["placement", "placements", "job", "company"],
answer: "💼 The placement cell conducts training, aptitude tests, technical sessions and campus recruitment drives."
},

{
keywords: ["hod", "head of department"],
answer: "👨‍🏫 The Head of Department manages the academic and administrative activities of the department."
},

{
keywords: ["principal"],
answer: "👨‍💼 The Principal is responsible for the overall administration and academic development of the college."
},

{
keywords: ["canteen", "food", "lunch"],
answer: "🍴 The college canteen provides food and refreshments for students and staff."
},

{
keywords: ["hostel", "accommodation"],
answer: "🏠 The college provides hostel facilities for eligible students. Please contact the college office for availability and rules."
},

{
keywords: ["transport", "bus", "buses"],
answer: "🚌 College transportation facilities are available on selected routes. Contact the transport office for route details."
},

{
keywords: ["certificate", "certificates", "bonafide"],
answer: "📄 Students can apply for certificates through the college office or student service section."
},

{
keywords: ["fee", "fees", "payment"],
answer: "💳 For fee details and payment information, please contact the college accounts section."
},

{
keywords: ["contact", "phone", "email"],
answer: "📞 You can contact the college office for official phone numbers, email addresses and other contact details."
},

{
keywords: ["thank", "thanks"],
answer: "😊 You're welcome! I am happy to help."
},

{
keywords: ["bye", "goodbye"],
answer: "👋 Goodbye! Have a great day!"
}

];


function sendMessage() {

const input = document.getElementById("userInput");

const question = input.value.trim();

if (question === "") {
return;
}

addMessage(question, "user");

const answer = getBotResponse(question);

setTimeout(function() {
addMessage(answer, "bot");
}, 500);

input.value = "";

}


function quickQuestion(question) {

addMessage(question, "user");

const answer = getBotResponse(question);

setTimeout(function() {
addMessage(answer, "bot");
}, 500);

}


function addMessage(message, sender) {

const chatBox = document.getElementById("chatBox");

const messageDiv = document.createElement("div");

messageDiv.classList.add("message");
messageDiv.classList.add(sender);

messageDiv.innerHTML = message;

chatBox.appendChild(messageDiv);

chatBox.scrollTop = chatBox.scrollHeight;

}


function getBotResponse(question) {

question = question.toLowerCase();

let bestAnswer = null;

let highestScore = 0;

for (let item of knowledgeBase) {

let score = 0;

for (let keyword of item.keywords) {

if (question.includes(keyword.toLowerCase())) {
score++;
}

}

if (score > highestScore) {

highestScore = score;

bestAnswer = item.answer;

}

}

if (bestAnswer !== null) {

return bestAnswer;

}

return "🤔 Sorry, I don't have information about that yet. Please ask me about college timings, departments, library, attendance, exams or placements.";

}


function handleEnter(event) {

if (event.key === "Enter") {

sendMessage();

}

}

</script>

</body>
</html>
